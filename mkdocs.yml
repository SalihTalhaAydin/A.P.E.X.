site_name: Apex Brain
site_description: J.A.R.V.I.S. for your smart home — AI assistant built on Home Assistant
site_url: ""
docs_dir: docs

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    logo: material/robot

nav:
  - Home: index.md
  - Project:
    - Vision: VISION.md
    - Roadmap: ROADMAP.md
    - Architecture: ARCHITECTURE.md
    - Workflow: WORKFLOW.md
    - Voice Pipeline: VOICE_PIPELINE.md
  - Device Guides:
    - Naming Convention: guides/device-naming.md
    - Setup Checklist: guides/ha-device-setup-checklist.md
    - Nest Thermostat: guides/nest-setup.md
    - Broadlink IR/RF: guides/broadlink-easy-setup.md
    - Broadlink e-Control Import: guides/broadlink-import-from-econtrol.md
    - Roku/TCL TV Standby: guides/roku-tcl-tv-when-off.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
