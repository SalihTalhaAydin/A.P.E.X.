# Home Assistant Add-on Configuration
# https://developers.home-assistant.io/docs/add-ons/configuration

name: "Apex Brain"
version: "0.8.3"
slug: "apex_brain"
description: "Personal AI assistant — full HA control, memory, vision, shell access"
url: "https://github.com/SalihTalhaAydin/A.P.E.X."
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false

# Network — host_network gives outbound access for LLM APIs
host_network: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Apex Brain API"

# Home Assistant API access
hassio_api: true
homeassistant_api: true
hassio_role: default
auth_api: true

# Filesystem access
map:
  - data:rw
  - config:rw
  - addons:rw
  - share:rw
  - media:rw

# Configuration options
options:
  litellm_model: "anthropic/claude-sonnet-4-6"
  openai_api_key: ""
  anthropic_api_key: ""
  gemini_api_key: ""
  embedding_model: "text-embedding-3-small"
  fact_extraction_model: "anthropic/claude-haiku-4-5-20251001"
  recent_turns: 10
  max_facts_in_context: 20
  ha_url_override: ""
  ha_token_override: ""

schema:
  litellm_model: str
  openai_api_key: password
  anthropic_api_key: password
  gemini_api_key: password
  embedding_model: str
  fact_extraction_model: str
  recent_turns: int
  max_facts_in_context: int
  ha_url_override: str
  ha_token_override: password

environment:
  DB_PATH: /data/apex.db
